name: Verify live Cloudflare Worker
on:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Verify deployed Phase 3A version and D1 binding
        env:
          WORKER_URL: https://crypto-market-data.qinggeinthewest.workers.dev
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 15); do
            response=$(curl --retry 1 -fsS --connect-timeout 5 --max-time 12 "$WORKER_URL/health" || true)
            echo "Health attempt $attempt: $response"
            if [[ "$response" == *'"version":"0.4.0-phase3a"'* ]] && [[ "$response" == *'"persistence_enabled":true'* ]]; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Live Worker version or D1 binding not verified. GitHub merge does not prove Cloudflare deployment."
            exit 1
          fi
      - name: Verify new read-only endpoints
        env:
          WORKER_URL: https://crypto-market-data.qinggeinthewest.workers.dev
        run: |
          set -euo pipefail
          for route in derivatives-audit derivatives-latest; do
            result=$(curl -fsS --connect-timeout 5 --max-time 15 "$WORKER_URL/$route")
            echo "$route response: ${result:0:1200}"
            if [[ "$result" != *'"status":'* ]]; then
              echo "::error::Missing JSON status from /$route"
              exit 1
            fi
          done
